name: Build KomaEdit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - "agent/**"
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      build_version: ${{ steps.version.outputs.build_version }}
      channel: ${{ steps.version.outputs.channel }}
      package_name: ${{ steps.version.outputs.package_name }}
      release_version: ${{ steps.version.outputs.release_version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve channel version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          development_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          release_version="$(sed -n 's/^release_version=//p' gradle.properties)"
          short_sha="${GITHUB_SHA::7}"
          base_version="${development_version%%-*}"

          if [[ -z "${development_version}" || -z "${release_version}" ]]; then
            echo "No se encontraron mod_version o release_version" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            channel="main"
            build_version="${release_version}"
            package_name="komaedit-${release_version}"
          elif [[ "${GITHUB_REF}" == "refs/heads/staging" ]]; then
            channel="staging"
            build_version="${development_version}.${short_sha}"
            package_name="komaedit-staging-${base_version}-${short_sha}"
          else
            channel="development"
            build_version="${development_version}.${short_sha}"
            package_name="komaedit-${build_version}"
          fi

          {
            echo "base_version=${base_version}"
            echo "build_version=${build_version}"
            echo "channel=${channel}"
            echo "package_name=${package_name}"
            echo "release_version=${release_version}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          echo "Canal: ${channel}"
          echo "Versión interna: ${build_version}"
          echo "Paquete: ${package_name}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew --no-daemon -Pmod_version=${{ steps.version.outputs.build_version }} build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ steps.version.outputs.short_sha }}
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compiled mod
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: build/libs/komaedit-${{ steps.version.outputs.build_version }}.jar
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download compiled mod
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.package_name }}
          path: release-assets

      - name: Publish channel release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_VERSION: ${{ needs.build.outputs.base_version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          asset="$(find release-assets -maxdepth 1 -type f -name '*.jar' -print -quit)"
          if [[ -z "${asset}" ]]; then
            echo "No se encontró el JAR compilado" >&2
            exit 1
          fi

          if [[ "${CHANNEL}" == "staging" ]]; then
            tag="staging-${BASE_VERSION}-${SHORT_SHA}"
            notes="Compilación automática de staging para ${GITHUB_SHA}. No es una versión estable."

            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${tag}" "${asset}" --clobber --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "${tag}" "${asset}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "${PACKAGE_NAME}" \
                --notes "${notes}" \
                --prerelease
            fi
          else
            tag="v${RELEASE_VERSION}"
            notes="Versión estable ${PACKAGE_NAME}."

            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              existing_target="$(gh release view "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json targetCommitish \
                --jq '.targetCommitish')"
              if [[ "${existing_target}" != "${GITHUB_SHA}" ]]; then
                echo "La versión estable ${RELEASE_VERSION} ya pertenece a ${existing_target}." >&2
                echo "Incrementa release_version antes de publicar otro commit en main." >&2
                exit 1
              fi
              gh release upload "${tag}" "${asset}" --clobber --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "${tag}" "${asset}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "${PACKAGE_NAME}" \
                --notes "${notes}"
            fi
          fi
