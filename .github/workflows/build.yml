name: Build KomaEdit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - "agent/**"
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v7
        with:
          name: komaedit-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
