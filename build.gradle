plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "EngineHub"
        url = "https://maven.enginehub.org/repo/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "komaedit" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.sk89q.worldedit:worldedit-fabric-mc1.21:${project.worldedit_version}"
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

def resourceVersion = project.version.toString()

processResources {
    inputs.property "version", resourceVersion

    filesMatching("fabric.mod.json") {
        expand "version": resourceVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.named("test") {
    useJUnitPlatform()
    // Las clases de prueba se reparten entre varias JVM: la mitad de los núcleos (una en una máquina de 2 o 3, como el
    // CI de un repositorio privado) y como mucho 4, que cada una se lleva su memoria. Ninguna prueba depende de lo que
    // deje otra ni del reloj de verdad.
    maxParallelForks = Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
    }
}

// Las ediciones enormes (1, 5 y 20 millones de bloques) con sus tablas: la misma prueba que corre en cada build, con
// KOMAEDIT_FULL_TESTS y la memoria que necesitan los 20 millones.
tasks.register("benchmark", Test) {
    description = "Mide las ediciones enormes (1, 5 y 20 millones de bloques) fuera del juego."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching "com.komainu.moxia.performance.HugeEditBenchmarkTest"
    }
    environment "KOMAEDIT_FULL_TESTS", "1"
    maxHeapSize = "3g"
    outputs.upToDateWhen { false }
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
